<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="joc-inapoi" content="clasa4.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="LOGO.png">
<link rel="stylesheet" href="joc.css">
<title>2048 – Jocuri Logice</title>
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: #F8F7FB; color: #231B33; overflow: hidden; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px; }
    :root { --s: min(92vw, 60dvh, 440px); }
    .top { width: var(--s); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    h1 { margin: 0; font-size: clamp(2.4rem, 11vw, 3.6rem); line-height: 1; color: #4A2370; }
    .scores { display: flex; gap: 8px; }
    .box { min-width: 76px; padding: 6px 12px; border-radius: 16px; background: #4A2370; color: #fff; text-align: center; font: 600 .8rem var(--j-font-text); text-transform: uppercase; letter-spacing: .04em; }
    .box b { display: block; font: 700 1.4rem var(--j-font); letter-spacing: 0; font-variant-numeric: tabular-nums; }
    .bar { width: var(--s); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .bar p { margin: 0; font: 600 .95rem/1.3 var(--j-font-text); color: #5B5270; }
    .small-btn { min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #E23B6B; color: #fff; font: 700 1rem var(--j-font); cursor: pointer; box-shadow: 0 4px 0 #B82A53; flex: none; }
    .small-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #B82A53; }
    #board { position: relative; width: var(--s); height: var(--s); padding: calc(var(--s) * .03); background: #D9CCEB; border-radius: calc(var(--s) * .05); }
    #cells, #tiles { position: absolute; inset: calc(var(--s) * .03); display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: calc(var(--s) * .03); }
    #cells div { background: rgba(255,255,255,.55); border-radius: calc(var(--s) * .03); }
    .tile { border-radius: calc(var(--s) * .03); display: flex; align-items: center; justify-content: center; font: 700 calc(var(--s) * .095) var(--j-font); transition: background .12s; }
    .tile.new { animation: pop .18s ease-out; } .tile.merged { animation: bump .18s ease-out; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes bump { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .t2 { background: #FFFFFF; color: #4A2370; } .t4 { background: #EFE9F7; color: #4A2370; }
    .t8 { background: #1FBF9A; color: #fff; } .t16 { background: #14937A; color: #fff; }
    .t32 { background: #FFB81C; color: #231B33; } .t64 { background: #E8541F; color: #fff; }
    .t128 { background: #E23B6B; color: #fff; font-size: calc(var(--s) * .08); } .t256 { background: #B82A53; color: #fff; font-size: calc(var(--s) * .08); }
    .t512 { background: #6A3BA0; color: #fff; font-size: calc(var(--s) * .08); } .t1024 { background: #4A2370; color: #fff; font-size: calc(var(--s) * .065); }
    .t2048 { background: linear-gradient(135deg, #FFD65C, #FFB81C); color: #231B33; font-size: calc(var(--s) * .065); box-shadow: 0 0 0 3px #fff; }
    .tbig { background: #231B33; color: #FFB81C; font-size: calc(var(--s) * .055); }
    .jg-overlay { position: fixed; }
</style>
</head>
<body class="jg">
<div class="top">
    <h1>2048</h1>
    <div class="scores"><div class="box">Scor<b id="score">0</b></div><div class="box">Record<b id="best">0</b></div></div>
</div>
<div class="bar"><p>Mută piesele cu săgețile sau cu degetul. Unește numerele egale!</p><button class="small-btn" id="newBtn" type="button">Joc nou</button></div>
<div id="board" role="application" aria-label="Tabla de joc 2048"><div id="cells"></div><div id="tiles"></div></div>

<div class="jg-overlay" id="overlay" hidden>
    <div class="jg-emoji" id="ovEmoji">🧩</div>
    <h1 class="jg-title" id="ovTitle" style="color:#fff">Joc terminat</h1>
    <p class="jg-text" id="ovText"></p>
    <button class="jg-btn" id="ovBtn" type="button">Încă o dată</button>
    <button class="jg-btn alt" id="ovBtn2" type="button" hidden>Continuă</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const N = 4;
let grid, score = 0, best = 0, won = false, keepGoing = false, over = false, lastNew = -1, mergedAt = new Set();
try { best = parseInt(localStorage.getItem('g2048_best') || '0', 10) || 0; } catch (e) {}
$('best').textContent = best;
for (let i = 0; i < N * N; i++) $('cells').appendChild(document.createElement('div'));

function emptyCells() { const r = []; grid.forEach((row, y) => row.forEach((v, x) => { if (!v) r.push([y, x]); })); return r; }
function spawn() {
    const e = emptyCells(); if (!e.length) return;
    const [y, x] = e[Math.floor(Math.random() * e.length)];
    grid[y][x] = Math.random() < .9 ? 2 : 4; lastNew = y * N + x;
}
function newGame() {
    grid = Array.from({ length: N }, () => Array(N).fill(0));
    score = 0; won = false; keepGoing = false; over = false; $('overlay').hidden = true;
    spawn(); spawn(); render();
}

function render() {
    const t = $('tiles'); t.innerHTML = '';
    grid.forEach((row, y) => row.forEach((v, x) => {
        const d = document.createElement('div');
        if (v) {
            d.className = 'tile ' + (v <= 2048 ? 't' + v : 'tbig');
            if (y * N + x === lastNew) d.classList.add('new');
            else if (mergedAt.has(y * N + x)) d.classList.add('merged');
            d.textContent = v;
        }
        t.appendChild(d);
    }));
    $('score').textContent = score;
    if (score > best) { best = score; $('best').textContent = best; try { localStorage.setItem('g2048_best', best); } catch (e) {} }
    lastNew = -1; mergedAt = new Set();
}

/* mută o linie spre stânga: întoarce {line, gained, merged[]} */
function slide(line) {
    const nums = line.filter(Boolean), out = [], merged = []; let gained = 0;
    for (let i = 0; i < nums.length; i++) {
        if (nums[i] === nums[i + 1]) { out.push(nums[i] * 2); gained += nums[i] * 2; merged.push(out.length - 1); i++; }
        else out.push(nums[i]);
    }
    while (out.length < N) out.push(0);
    return { line: out, gained, merged };
}

function move(dir) {
    if (over) return;
    let moved = false, gained = 0;
    for (let k = 0; k < N; k++) {
        // citește linia k în direcția mișcării
        const coords = [];
        for (let i = 0; i < N; i++) {
            if (dir === 'left') coords.push([k, i]); if (dir === 'right') coords.push([k, N - 1 - i]);
            if (dir === 'up') coords.push([i, k]); if (dir === 'down') coords.push([N - 1 - i, k]);
        }
        const before = coords.map(([y, x]) => grid[y][x]);
        const res = slide(before);
        coords.forEach(([y, x], i) => { grid[y][x] = res.line[i]; });
        res.merged.forEach(i => mergedAt.add(coords[i][0] * N + coords[i][1]));
        if (res.line.some((v, i) => v !== before[i])) moved = true;
        gained += res.gained;
    }
    if (!moved) { mergedAt = new Set(); return; }
    score += gained; spawn(); render(); checkEnd();
}

function canMove() {
    if (emptyCells().length) return true;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        if (x < N - 1 && grid[y][x] === grid[y][x + 1]) return true;
        if (y < N - 1 && grid[y][x] === grid[y + 1][x]) return true;
    }
    return false;
}
function checkEnd() {
    if (!won && !keepGoing && grid.some(r => r.includes(2048))) {
        won = true;
        show('🏆', 'Ai ajuns la 2048!', 'Bravo! Poți continua să joci sau poți începe un joc nou.', 'Joc nou', true); return;
    }
    if (!canMove()) { over = true; show('🧩', 'Nu mai sunt mutări', 'Scorul tău: ' + score + (score >= best && score > 0 ? ' – record nou! 🌟' : ''), 'Încă o dată', false); }
}
function show(emoji, title, text, btn, cont) {
    $('ovEmoji').textContent = emoji; $('ovTitle').textContent = title; $('ovText').textContent = text;
    $('ovBtn').textContent = btn; $('ovBtn2').hidden = !cont; $('overlay').hidden = false;
}
$('ovBtn').addEventListener('click', newGame);
$('ovBtn2').addEventListener('click', () => { keepGoing = true; $('overlay').hidden = true; });
$('newBtn').addEventListener('click', newGame);

const keys = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' };
window.addEventListener('keydown', (e) => { const d = keys[e.key]; if (d && $('overlay').hidden) { e.preventDefault(); move(d); } });

let sx = 0, sy = 0, tracking = false;
window.addEventListener('pointerdown', (e) => { if (e.target.closest('button, .jg-overlay, .joc-inapoi')) return; sx = e.clientX; sy = e.clientY; tracking = true; });
window.addEventListener('pointerup', (e) => {
    if (!tracking) return; tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 28 || !$('overlay').hidden) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left'); else move(dy > 0 ? 'down' : 'up');
});
window.addEventListener('pointercancel', () => { tracking = false; });
newGame();
</script>
<script src="joc.js"></script>
</body>
</html>
