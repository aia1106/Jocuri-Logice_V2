<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="joc-inapoi" content="clasa4.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="LOGO.png">
<link rel="stylesheet" href="joc.css">
<title>Fotbal – Jocuri Logice</title>
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: #2A1450; overflow: hidden; touch-action: none; display: flex; align-items: center; justify-content: center; }
    #stadium {
        position: relative; flex: none; width: 360px; height: 640px; transform-origin: center center;
        background: repeating-linear-gradient(#34C97A, #34C97A 45px, #2BB36B 45px, #2BB36B 90px);
        border: 5px solid #fff; border-radius: 24px; overflow: hidden; box-sizing: content-box;
        box-shadow: 0 18px 40px -16px rgba(0,0,0,.6);
    }
    #goal { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); width: 220px; height: 110px; border: 5px solid #fff; border-bottom: none; border-radius: 6px 6px 0 0;
        background: repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 2px, transparent 2px 10px), repeating-linear-gradient(-45deg, rgba(255,255,255,.18) 0 2px, transparent 2px 10px); }
    #keeper { position: absolute; top: 140px; left: 162px; width: 36px; height: 34px; z-index: 5; transition: left .3s ease-out; font-size: 30px; line-height: 34px; text-align: center; }
    #ball { position: absolute; top: 520px; left: 160px; width: 40px; height: 40px; z-index: 10; font-size: 38px; line-height: 40px; text-align: center; }
    #power-container { position: absolute; left: 12px; top: 200px; width: 12px; height: 150px; background: rgba(255,255,255,.35); border: 2px solid #fff; border-radius: 8px; overflow: hidden; }
    #power-bar { position: absolute; bottom: 0; width: 100%; height: 0%; background: #E23B6B; }
    #arrow { position: absolute; top: 540px; left: 178px; width: 6px; background: #FFB81C; transform-origin: top center; display: none; z-index: 8; border-radius: 10px; }
    #msg { position: absolute; top: 240px; width: 100%; text-align: center; font: 700 64px var(--j-font); display: none; z-index: 100; color: #FFB81C; text-shadow: 0 5px 0 #4A2370, 0 0 20px rgba(0,0,0,.3); }
    #math-quiz { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 24px 20px; border-radius: 24px; text-align: center; display: none; z-index: 200; box-shadow: 0 18px 40px -10px rgba(0,0,0,.5); width: 280px; }
    #math-quiz p { margin: 0 0 6px; font: 700 .95rem var(--j-font-text); color: #5B5270; }
    #math-quiz h2 { margin: 0 0 14px; color: #4A2370; font: 700 2rem var(--j-font); }
    #math-input { width: 110px; font: 700 1.8rem var(--j-font); text-align: center; padding: 8px; margin-bottom: 14px; border: 2px solid #E6E2EE; border-radius: 14px; color: #231B33; }
    #math-input:focus { border-color: #4A2370; outline: none; }
    #math-input.bad { border-color: #E23B6B; background: #FFE9EF; }
    #math-btn { display: block; width: 100%; min-height: 52px; background: #E23B6B; color: #fff; border: 0; border-radius: 999px; font: 700 1.2rem var(--j-font); cursor: pointer; box-shadow: 0 5px 0 #B82A53; }
    .jg-hud { position: absolute; max-width: none; }
</style>
</head>
<body class="jg">
<div id="stadium">
    <div class="jg-hud"><span class="jg-pill">⚽ <b id="score">0</b></span></div>
    <div id="power-container"><div id="power-bar"></div></div>
    <div id="goal"></div>
    <div id="keeper">🧤</div>
    <div id="arrow"></div>
    <div id="ball">⚽</div>
    <div id="msg">GOOOL!</div>

    <div id="math-quiz" role="dialog" aria-label="Întrebare de matematică">
        <p>Ai ratat! Răspunde corect și mai tragi o dată:</p>
        <h2 id="question">10 + 5 = ?</h2>
        <input type="text" inputmode="numeric" pattern="[0-9]*" id="math-input" placeholder="?" autocomplete="off">
        <button id="math-btn" type="button">Verifică</button>
    </div>

    <div class="jg-overlay" id="startScreen" style="position:absolute">
        <div class="jg-emoji">⚽</div>
        <h1 class="jg-title">Fotbal</h1>
        <p class="jg-text">Trage în direcția opusă loviturii, ca la praștie. Dacă ratezi, rezolvă un calcul!</p>
        <button class="jg-btn" id="startBtn" type="button">Start</button>
    </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const ball = $('ball'), arrow = $('arrow'), keeper = $('keeper'), powerBar = $('power-bar'), scoreEl = $('score'), msg = $('msg');
const quiz = $('math-quiz'), questionEl = $('question'), mathInput = $('math-input'), mathBtn = $('math-btn'), stadium = $('stadium');

let score = 0, isDragging = false, gameActive = false, correctAnswer = 0, startX, startY, scale = 1, quizOpen = false;
const initX = 160, initY = 520;

function fit() {
    if (quizOpen) return;
    scale = Math.min((window.innerHeight - 16) / 650, (window.innerWidth - 8) / 370, 1.5);
    stadium.style.transform = 'scale(' + scale + ')';
}
window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 200)); fit();

$('startBtn').addEventListener('click', () => { $('startScreen').hidden = true; gameActive = true; });

const handleStart = (e) => {
    if (!gameActive || e.target.closest('#math-quiz, .jg-overlay')) return;
    startX = e.clientX; startY = e.clientY; isDragging = true; arrow.style.display = 'block';
};
const handleMove = (e) => {
    if (!isDragging) return;
    const dx = (e.clientX - startX) / scale, dy = (e.clientY - startY) / scale;
    const power = Math.min(Math.hypot(dx, dy) / 150, 1);
    powerBar.style.height = (power * 100) + '%';
    arrow.style.height = (power * 150) + 'px';
    arrow.style.transform = `rotate(${Math.atan2(dx, -dy) * 180 / Math.PI}deg)`;
};
const handleEnd = (e) => {
    if (!isDragging) return;
    isDragging = false; arrow.style.display = 'none';
    const dx = (e.clientX - startX) / scale, dy = (e.clientY - startY) / scale;
    if (Math.abs(dx) > 15 || Math.abs(dy) > 15) shoot(-dx * 1.8, -dy * 3.8); else powerBar.style.height = '0%';
};

function shoot(tx, ty) {
    gameActive = false;
    const t0 = performance.now(), duration = 600, sX = initX, sY = initY;
    const fX = sX + tx, fY = Math.max(75, sY + ty);
    setTimeout(() => { keeper.style.left = Math.max(70, Math.min(250, 162 + tx * .4 + (Math.random() - .5) * 50)) + 'px'; }, 100);
    (function frame(now) {
        const p = Math.min((now - t0) / duration, 1), ease = 1 - Math.pow(1 - p, 3);
        const cx = sX + (fX - sX) * ease, cy = sY + (fY - sY) * ease;
        if (cy <= 175) {
            const kX = parseFloat(keeper.style.left);
            if (Math.abs(cx + 20 - (kX + 18)) < 25) { ball.style.top = '175px'; ball.style.left = (kX + 2) + 'px'; return finish(false); }
        }
        ball.style.left = cx + 'px'; ball.style.top = cy + 'px';
        ball.style.transform = `scale(${1 - p * .45}) rotate(${p * 540}deg)`;
        if (p < 1) requestAnimationFrame(frame); else finish(cx > 70 && cx < 250 && cy <= 130);
    })(t0);
}

function finish(goal) {
    if (goal) { score++; scoreEl.textContent = score; msg.style.display = 'block'; setTimeout(reset, 1500); }
    else showMathQuiz();
}

function showMathQuiz() {
    let a, b;
    if (Math.random() > .5) { a = Math.floor(Math.random() * 11); b = Math.floor(Math.random() * (21 - a)); correctAnswer = a + b; questionEl.textContent = `${a} + ${b} = ?`; }
    else { a = Math.floor(Math.random() * 11) + 10; b = Math.floor(Math.random() * a); correctAnswer = a - b; questionEl.textContent = `${a} − ${b} = ?`; }
    quizOpen = true; quiz.style.display = 'block'; mathInput.value = ''; mathInput.focus({ preventScroll: true });
}
function checkAnswer() {
    if (parseInt(mathInput.value, 10) === correctAnswer) { quizOpen = false; quiz.style.display = 'none'; mathInput.blur(); setTimeout(fit, 250); reset(); }
    else { mathInput.classList.add('bad'); setTimeout(() => mathInput.classList.remove('bad'), 500); mathInput.select(); }
}
mathBtn.addEventListener('click', checkAnswer);
mathInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });

function reset() {
    msg.style.display = 'none'; powerBar.style.height = '0%';
    ball.style.transform = 'scale(1)'; ball.style.left = initX + 'px'; ball.style.top = initY + 'px';
    keeper.style.left = '162px'; gameActive = true;
}

stadium.addEventListener('pointerdown', handleStart);
window.addEventListener('pointermove', handleMove);
window.addEventListener('pointerup', handleEnd);
window.addEventListener('pointercancel', () => { isDragging = false; arrow.style.display = 'none'; powerBar.style.height = '0%'; });
</script>
<script src="joc.js"></script>
</body>
</html>
