<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<link rel="icon" href="LOGO.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
<meta charset="UTF-8">
    
    
    <style>
        .exercise-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin: 40px auto;
            max-width: 800px;
            box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.1);
            color: black;
        }

        .exercise {
            font-size: 24px;
            margin: 20px 0;
        }

        input[type="number"] {
            font-size: 20px;
            padding: 5px;
            width: 80px;
            text-align: center;
            border-radius: 8px;
            border: 2px solid #aacc00;
        }

        button.verifica-btn {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            background-color: #006400;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.3s;
        }

        button.verifica-btn:hover {
            background-color: #009900;
            transform: translateY(-2px);
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<a class="skip-link" href="#continut">Sari la conținut</a>
<header class="site-header">
    <div class="header-top">
        <a class="brand" href="index.html" aria-label="Jocuri Logice – pagina principală">
            <img src="logo-palat.png" alt="" class="header-logo" width="113" height="38">
            <span class="brand-text"><span class="site-name">Jocuri Logice</span></span>
        </a>
        <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="meniu"><span class="menu-icon" aria-hidden="true">☰</span><span>Meniu</span></button>
    </div>
    <nav aria-label="Navigare principală"><ul class="menu" id="meniu"><li><a href="index.html">Acasă</a></li><li><a href="clasa0.html">Clasa 0</a></li><li><a href="clasa1.html">Clasa I</a></li><li><a href="clasa2.html">Clasa a II-a</a></li><li><a href="clasa3.html">Clasa a III-a</a></li><li><a href="clasa4.html">Clasa a IV-a</a></li><li><a href="jocuri.html">Jocuri</a></li><li><a href="concurs.html">Concurs</a></li><li><a href="info.html">Informații</a></li><li><a href="resursedidactice.html">Resurse</a></li><li><a href="contact.html">Contact</a></li></ul></nav>
</header>
<main id="continut" class="legacy">
<section class="exercise-container">
    <h2>Rezolvă adunările!</h2>

    <div class="exercise">1 + 3 = <input type="number" id="q1"></div>
    <div class="exercise">5 + 2 = <input type="number" id="q2"></div>
    <div class="exercise">4 + 4 = <input type="number" id="q3"></div>
    <div class="exercise">6 + 1 = <input type="number" id="q4"></div>
    <div class="exercise">2 + 7 = <input type="number" id="q5"></div>

    <button class="verifica-btn" onclick="verifica()">Verifică Răspunsurile</button>

    <div id="feedback" class="result"></div>
</section>



<script>
    function verifica() {
        const raspunsuri = [4, 7, 8, 7, 9];
        let scor = 0;

        for (let i = 1; i <= 5; i++) {
            const input = document.getElementById("q" + i);
            if (parseInt(input.value) === raspunsuri[i - 1]) {
                scor++;
                input.style.backgroundColor = "#d4edda"; // verde deschis
            } else {
                input.style.backgroundColor = "#f8d7da"; // roșu deschis
            }
        }

        const mesaj = scor === 5 ? "Bravo! Le-ai făcut pe toate corect! 🎉" :
                      `Ai ${scor} răspunsuri corecte din 5. Mai încearcă! 😊`;

        document.getElementById("feedback").innerText = mesaj;
    }
</script>
</main>
<footer class="site-footer">

</footer>

</body>
