<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="joc-inapoi" content="jocuri.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="LOGO.png">
<link rel="stylesheet" href="joc.css">
<title>Cucerirea planetelor – Jocuri Logice</title>
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #2A1450; color: #fff; overflow: hidden; touch-action: none; }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .jg-hud { gap: 8px; }
    #ui-bottom { position: fixed; z-index: 10; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; }
    #btn-power { pointer-events: auto; min-height: 56px; padding: 0 28px; border: 0; border-radius: 999px; cursor: pointer; font: 700 1.15rem var(--j-font);
        background: #6A3BA0; color: #cdbbe6; box-shadow: 0 6px 0 #3B1D63; }
    #btn-power:disabled { opacity: .85; cursor: default; }
    #btn-power.ready { background: #FFB81C; color: #231B33; box-shadow: 0 6px 0 #C99A10; animation: pulse 0.9s infinite alternate; }
    #btn-power.ready:active { transform: translateY(4px); box-shadow: 0 2px 0 #C99A10; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.07); } }
    #tip { position: fixed; z-index: 8; left: 0; right: 0; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); text-align: center; font: 700 .95rem var(--j-font-text); color: #D9CCEB; pointer-events: none; padding: 0 16px; }
</style>
</head>
<body class="jg">
<div class="jg-hud"><span class="jg-pill">🪐 Nivel <b id="level-val">1</b></span><span class="jg-pill">⚡ <b id="energy-val">0</b>%</span></div>
<canvas id="gameCanvas"></canvas>
<div id="tip">Trage de la o planetă verde spre alta ca să trimiți locuitori</div>
<div id="ui-bottom"><button id="btn-power" type="button" disabled>☄️ Meteorit (50%)</button></div>

<div class="jg-overlay" id="overlay">
    <div class="jg-emoji" id="ovEmoji">🪐</div>
    <h1 class="jg-title" id="ovTitle">Cucerirea planetelor</h1>
    <p class="jg-text" id="ovText">Trage de la o planetă verde spre alta și trimiți jumătate din locuitori. Cucerește toate planetele roșii!</p>
    <button class="jg-btn" id="startBtn" type="button">Start</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
const levelVal = document.getElementById('level-val'), energyVal = document.getElementById('energy-val');
const btnPower = document.getElementById('btn-power'), overlay = document.getElementById('overlay'), startBtn = document.getElementById('startBtn');

let W = 0, H = 0, dpr = 1, nodes = [], particles = [], beams = [], stars = [];
let selectedNode = null, isDragging = false, dragEnd = { x: 0, y: 0 };
let level = 1, energy = 0, gameActive = false, radarAngle = 0, aiTimer = null;
const COL = { player: '#1FBF9A', enemy: '#E23B6B', neutral: '#B9A6D6' };

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + .4, a: Math.random() * .5 + .25 }));
    nodes.forEach(n => n.place());
}

class Node {
    constructor(nx, ny, owner, count) { this.nx = nx; this.ny = ny; this.owner = owner; this.count = count; this.last = Date.now(); this.place(); }
    place() { this.x = this.nx * W; this.y = this.ny * H; this.radius = Math.min(W * .085, 38); }
    color() { return COL[this.owner]; }
    draw() {
        const c = this.color(), r = this.radius;
        // aură
        ctx.globalAlpha = .18; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(this.x, this.y, r + 8, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
        // planetă
        const g = ctx.createRadialGradient(this.x - r * .35, this.y - r * .4, r * .1, this.x, this.y, r);
        g.addColorStop(0, '#ffffff'); g.addColorStop(.25, c); g.addColorStop(1, shade(c));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, 6.283); ctx.fill();
        if (this.owner !== 'neutral') {
            ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(this.x, this.y, r + 4, radarAngle, radarAngle + 1.4); ctx.stroke();
        }
        if (this === selectedNode) { ctx.strokeStyle = '#FFB81C'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(this.x, this.y, r + 7, 0, 6.283); ctx.stroke(); }
        ctx.fillStyle = this.owner === 'neutral' ? '#2A1450' : '#fff';
        ctx.font = `700 ${Math.round(r * .62)}px Fredoka, "Trebuchet MS", sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(Math.floor(this.count), this.x, this.y + 1);
        this.update();
    }
    update() {
        if (!gameActive || this.owner === 'neutral') return;
        const now = Date.now();
        if (now - this.last > 1000) {
            this.count += 1; this.last = now;
            if (this.owner === 'player' && energy < 100) { energy = Math.min(100, energy + 1); updateEnergyUI(); }
        }
    }
}
function shade(hex) { const n = parseInt(hex.slice(1), 16); const f = .62; return `rgb(${(n >> 16) * f | 0},${(n >> 8 & 255) * f | 0},${(n & 255) * f | 0})`; }

function updateEnergyUI() {
    energyVal.textContent = Math.floor(energy);
    const ready = energy >= 50;
    btnPower.disabled = !ready; btnPower.classList.toggle('ready', ready);
}

function initLevel() {
    nodes = []; beams = []; particles = []; energy = 0; updateEnergyUI();
    levelVal.textContent = level; gameActive = true; selectedNode = null; isDragging = false;
    const portrait = H > W;
    const pPos = portrait ? [.5, .78] : [.1, .5], ePos = portrait ? [.5, .16] : [.9, .5];
    nodes.push(new Node(pPos[0], pPos[1], 'player', 15));
    nodes.push(new Node(ePos[0], ePos[1], 'enemy', 15 + level * 5));
    const want = Math.min(2 + level, 8), r = Math.min(W * .085, 38);
    let tries = 0;
    while (nodes.length < 2 + want && tries++ < 400) {
        const nx = (r * 1.6 + Math.random() * (W - r * 3.2)) / W;
        const ny = (110 + Math.random() * (H - 300)) / H;
        const x = nx * W, y = ny * H;
        if (nodes.every(n => Math.hypot(n.x - x, n.y - y) > r * 3)) nodes.push(new Node(nx, ny, 'neutral', Math.floor(Math.random() * 15)));
    }
    scheduleAI();
}

function scheduleAI() {
    clearTimeout(aiTimer);
    aiTimer = setTimeout(() => {
        if (gameActive) {
            nodes.filter(n => n.owner === 'enemy').forEach(en => {
                if (en.count > 12 + level) {
                    const targets = nodes.filter(n => n.owner !== 'enemy');
                    if (targets.length) handleAttack(en, targets[Math.floor(Math.random() * targets.length)]);
                }
            });
        }
        scheduleAI();
    }, Math.max(1500, 4000 - level * 200));
}

function handleAttack(from, to) {
    if (!from || !to || from === to || from.count < 2) return;
    const sent = Math.floor(from.count / 2);
    from.count -= sent;
    beams.push({ x1: from.x, y1: from.y, x2: to.x, y2: to.y, c: from.color(), life: 1 });
    if (from.owner === to.owner) to.count += sent;
    else {
        to.count -= sent;
        if (to.count < 0) { to.count = Math.abs(to.count); to.owner = from.owner; to.last = Date.now(); burst(to.x, to.y, from.color()); }
    }
    checkGameState();
}

function usePower() {
    if (energy < 50 || !gameActive) return;
    energy -= 50; updateEnergyUI();
    nodes.forEach(n => { if (n.owner === 'enemy') { n.count = Math.max(0, n.count - 25); burst(n.x, n.y, '#FFB81C'); } });
}
btnPower.addEventListener('click', usePower);

function burst(x, y, color) { for (let i = 0; i < 14; i++) particles.push({ x, y, color, vx: (Math.random() - .5) * 8, vy: (Math.random() - .5) * 8, life: 1 }); }

function checkGameState() {
    if (!gameActive) return;
    const enemies = nodes.filter(n => n.owner === 'enemy').length, mine = nodes.filter(n => n.owner === 'player').length;
    if (enemies === 0) endGame(true); else if (mine === 0) endGame(false);
}
function endGame(win) {
    gameActive = false; clearTimeout(aiTimer);
    document.getElementById('ovEmoji').textContent = win ? '🎉' : '🌑';
    document.getElementById('ovTitle').textContent = win ? 'Ai cucerit galaxia!' : 'Planetele au fost pierdute';
    document.getElementById('ovText').textContent = win ? `Nivelul ${level} terminat. Ești gata pentru nivelul ${level + 1}?` : 'Nu-i nimic, încearcă din nou de la nivelul 1.';
    startBtn.textContent = win ? 'Nivelul următor' : 'Încearcă din nou';
    startBtn.dataset.win = win ? '1' : '0';
    setTimeout(() => { overlay.hidden = false; }, 600);
}
startBtn.addEventListener('click', () => {
    if (startBtn.dataset.win === '1') level++; else if (startBtn.dataset.win === '0') level = 1;
    startBtn.dataset.win = ''; overlay.hidden = true; document.getElementById('tip').style.display = 'none';
    initLevel();
});

/* control cu pointer: funcționează la fel pe touch și mouse */
function nodeAt(x, y, pad) { return nodes.find(n => Math.hypot(n.x - x, n.y - y) < n.radius + pad); }
canvas.addEventListener('pointerdown', (e) => {
    if (!gameActive) return;
    const n = nodeAt(e.clientX, e.clientY, 14);
    if (n && n.owner === 'player') { selectedNode = n; isDragging = true; dragEnd = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener('pointermove', (e) => { if (isDragging) dragEnd = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', (e) => {
    if (!isDragging) return;
    const t = nodeAt(e.clientX, e.clientY, 18);
    if (t) handleAttack(selectedNode, t);
    isDragging = false; selectedNode = null;
});
canvas.addEventListener('pointercancel', () => { isDragging = false; selectedNode = null; });

function loop() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2A1450'); g.addColorStop(1, '#4A2370');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const s of stars) { ctx.globalAlpha = s.a; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill(); }
    ctx.globalAlpha = 1;
    radarAngle += .04;

    if (isDragging && selectedNode) {
        ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 4; ctx.setLineDash([4, 10]); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(selectedNode.x, selectedNode.y); ctx.lineTo(dragEnd.x, dragEnd.y); ctx.stroke(); ctx.setLineDash([]);
        const t = nodeAt(dragEnd.x, dragEnd.y, 18);
        if (t && t !== selectedNode) { ctx.strokeStyle = '#FFB81C'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(t.x, t.y, t.radius + 7, 0, 6.283); ctx.stroke(); }
    }
    for (let i = beams.length - 1; i >= 0; i--) {
        const b = beams[i]; b.life -= .06;
        if (b.life <= 0) { beams.splice(i, 1); continue; }
        ctx.globalAlpha = b.life; ctx.strokeStyle = b.c; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x1 + (b.x2 - b.x1) * (1 - b.life * .5), b.y1 + (b.y2 - b.y1) * (1 - b.life * .5)); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= .03;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    nodes.forEach(n => n.draw());
    requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize(); initLevel(); gameActive = false; // pregătește un tablou frumos în spatele ecranului de start
loop();
</script>
<script src="joc.js"></script>
</body>
</html>
