<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="joc-inapoi" content="clasa4.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="LOGO.png">
<link rel="stylesheet" href="joc.css">
<title>Săpăturile de diamante – Jocuri Logice</title>
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    :root { --cell-size: 36px; }
    body { background: #2A1450; color: #fff; overflow: hidden; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    #hud { display: flex; gap: 10px; }
    #game-container { position: relative; display: grid; grid-template-columns: repeat(9, var(--cell-size)); grid-template-rows: repeat(13, var(--cell-size)); background: #5B3A29; border: 6px solid #6A3BA0; border-radius: 22px; overflow: hidden; box-shadow: 0 18px 40px -16px rgba(0,0,0,.6); }
    .cell { width: var(--cell-size); height: var(--cell-size); display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell-size) * .55); }
    .dirt { background: #C18A57; box-shadow: inset 0 0 0 1px rgba(91,58,41,.25), inset 3px 3px 0 rgba(255,255,255,.08); }
    .empty { background: #5B3A29; }
    .crystal::after { content: '💎'; animation: pulse 1s infinite alternate; }
    .rock::after { content: '🪨'; }
    #player { position: absolute; width: var(--cell-size); height: var(--cell-size); z-index: 10; display: flex; align-items: center; justify-content: center; transition: left .1s ease, top .1s ease; font-size: calc(var(--cell-size) * .6); }
    #player::before { content: ''; position: absolute; inset: 12%; border-radius: 50%; background: #1FBF9A; box-shadow: 0 0 0 3px rgba(255,255,255,.7); }
    #player::after { content: '🤖'; position: relative; }
    #controls { display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(2, 62px); gap: 8px; }
    .dp { width: 62px; height: 62px; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); color: #4A2370; font-size: 1.6rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 5px 0 #C9C2D8; -webkit-tap-highlight-color: transparent; touch-action: none; }
    .dp:active { transform: translateY(3px); box-shadow: 0 2px 0 #C9C2D8; background: #FFB81C; }
    #dp-up { grid-column: 2; } #dp-left { grid-column: 1; grid-row: 2; } #dp-down { grid-column: 2; grid-row: 2; } #dp-right { grid-column: 3; grid-row: 2; }
    @media (hover: hover) and (pointer: fine) { #controls { display: none; } }
    #bravo { position: absolute; inset: 0; z-index: 150; display: none; align-items: center; justify-content: center; background: rgba(42,20,80,.7); }
    #bravo span { font: 700 2.2rem var(--j-font); background: #FFB81C; color: #231B33; padding: 14px 28px; border-radius: 999px; box-shadow: 0 6px 0 #C99A10; }
    .jg-overlay { position: fixed; }
    @keyframes pulse { from { transform: scale(.85); } to { transform: scale(1.1); } }
    .hurt { box-shadow: inset 0 0 40px 8px rgba(226,59,107,.8), 0 18px 40px -16px rgba(0,0,0,.6) !important; }
</style>
</head>
<body class="jg">
<div id="hud"><span class="jg-pill" style="position:static">💎 <b id="score">0</b></span><span class="jg-pill" style="position:static">❤️ <b id="lives">3</b></span></div>

<div id="game-container">
    <div id="player"></div>
    <div id="bravo"><span>Bravo! +200</span></div>
</div>

<div id="controls" aria-label="Butoane de mișcare">
    <button class="dp" id="dp-up" type="button" aria-label="Sus">▲</button>
    <button class="dp" id="dp-left" type="button" aria-label="Stânga">◀</button>
    <button class="dp" id="dp-down" type="button" aria-label="Jos">▼</button>
    <button class="dp" id="dp-right" type="button" aria-label="Dreapta">▶</button>
</div>

<div class="jg-overlay" id="overlay">
    <div class="jg-emoji" id="ovEmoji">💎</div>
    <h1 class="jg-title" id="ovTitle">Săpăturile de diamante</h1>
    <p class="jg-text" id="ovText">Sapă prin pământ și strânge toate diamantele. Ferește-te de pietrele care cad!</p>
    <p class="jg-best" id="ovBest"></p>
    <button class="jg-btn" id="startBtn" type="button">Start</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const container = $('game-container'), scoreEl = $('score'), livesEl = $('lives'), bravo = $('bravo'), overlay = $('overlay');
const ROWS = 13, COLS = 9;
let CELL = 36, score = 0, lives = 3, grid = [], crystalsLeft = 0, gameActive = false, playerPos = { x: 4, y: 0 }, best = 0, invulnerable = false;
try { best = parseInt(localStorage.getItem('digger_best') || '0', 10) || 0; } catch (e) {}

function sizeCells() {
    const availH = window.innerHeight - 40 - (matchMedia('(hover: hover) and (pointer: fine)').matches ? 70 : 200) - 24;
    const availW = window.innerWidth - 36;
    CELL = Math.max(24, Math.min(44, Math.floor(Math.min(availH / ROWS, availW / COLS))));
    document.documentElement.style.setProperty('--cell-size', CELL + 'px');
    updatePlayerDisplay();
}

function initGame(keepScore) {
    container.querySelectorAll('.cell').forEach(c => c.remove());
    grid = []; crystalsLeft = 0; playerPos = { x: 4, y: 0 };
    for (let y = 0; y < ROWS; y++) {
        grid[y] = [];
        for (let x = 0; x < COLS; x++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            let type = 'dirt';
            if (y === 0 && x === 4) type = 'empty';
            else if (Math.random() < .15 && y > 1) type = 'rock';
            else if (Math.random() < .10 && y > 1) { type = 'crystal'; crystalsLeft++; }
            cell.classList.add(type);
            container.insertBefore(cell, $('player'));
            grid[y][x] = { el: cell, type };
        }
    }
    if (crystalsLeft === 0) { grid[5][5].type = 'crystal'; grid[5][5].el.className = 'cell crystal'; crystalsLeft = 1; }
    if (!keepScore) { score = 0; lives = 3; scoreEl.textContent = '0'; livesEl.textContent = '3'; }
    updatePlayerDisplay();
}

function updatePlayerDisplay() {
    const p = $('player');
    p.style.left = (playerPos.x * CELL) + 'px';
    p.style.top = (playerPos.y * CELL) + 'px';
}

function movePlayer(dir) {
    if (!gameActive) return;
    let nx = playerPos.x, ny = playerPos.y;
    if (dir === 'up') ny--; if (dir === 'down') ny++; if (dir === 'left') nx--; if (dir === 'right') nx++;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;
    if (grid[ny][nx].type === 'rock') return;
    playerPos.x = nx; playerPos.y = ny;
    const cur = grid[ny][nx];
    if (cur.type === 'dirt' || cur.type === 'crystal') {
        if (cur.type === 'crystal') { score += 50; crystalsLeft--; scoreEl.textContent = score; }
        cur.type = 'empty'; cur.el.className = 'cell empty';
        checkVictory();
    }
    updatePlayerDisplay();
}

function checkVictory() {
    if (crystalsLeft > 0) return;
    gameActive = false; score += 200; scoreEl.textContent = score;
    bravo.style.display = 'flex';
    setTimeout(() => { bravo.style.display = 'none'; initGame(true); gameActive = true; }, 1800);
}

/* pietrele cad */
setInterval(() => {
    if (!gameActive) return;
    for (let y = ROWS - 2; y >= 0; y--) for (let x = 0; x < COLS; x++) {
        if (grid[y][x].type === 'rock' && grid[y + 1][x].type === 'empty') {
            if (playerPos.x === x && playerPos.y === y + 1) hitPlayer();
            grid[y][x].type = 'empty'; grid[y][x].el.className = 'cell empty';
            grid[y + 1][x].type = 'rock'; grid[y + 1][x].el.className = 'cell rock';
        }
    }
}, 400);

function hitPlayer() {
    if (invulnerable) return;
    lives--; livesEl.textContent = lives;
    container.classList.add('hurt'); setTimeout(() => container.classList.remove('hurt'), 350);
    invulnerable = true; setTimeout(() => invulnerable = false, 700);
    if (lives <= 0) {
        gameActive = false;
        if (score > best) { best = score; try { localStorage.setItem('digger_best', best); } catch (e) {} }
        $('ovEmoji').textContent = score >= 300 ? '🌟' : '⛏️';
        $('ovTitle').textContent = 'Ai strâns ' + score + ' puncte!';
        $('ovText').textContent = 'Încearcă din nou și adună și mai multe diamante.';
        $('ovBest').textContent = '🏆 Cel mai bun scor: ' + best;
        $('startBtn').textContent = 'Încă o dată';
        overlay.hidden = false;
    }
}

$('startBtn').addEventListener('click', () => { initGame(false); overlay.hidden = true; gameActive = true; });

/* tastatură */
const keyMap = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
window.addEventListener('keydown', (e) => { const d = keyMap[e.key]; if (d) { e.preventDefault(); movePlayer(d); } });

/* butoane: apăsare lungă = mișcare repetată */
function bindHold(id, dir) {
    const b = $(id); let t = null;
    const stop = () => { clearInterval(t); t = null; };
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); movePlayer(dir); stop(); t = setInterval(() => movePlayer(dir), 160); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
}
bindHold('dp-up', 'up'); bindHold('dp-down', 'down'); bindHold('dp-left', 'left'); bindHold('dp-right', 'right');

/* swipe pe teren */
let sx = 0, sy = 0;
container.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; });
container.addEventListener('pointerup', (e) => {
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) movePlayer(dx > 0 ? 'right' : 'left'); else movePlayer(dy > 0 ? 'down' : 'up');
});

window.addEventListener('resize', sizeCells);
window.addEventListener('orientationchange', () => setTimeout(sizeCells, 200));
$('ovBest').textContent = best ? '🏆 Cel mai bun scor: ' + best : '';
sizeCells(); initGame(false);
</script>
<script src="joc.js"></script>
</body>
</html>
