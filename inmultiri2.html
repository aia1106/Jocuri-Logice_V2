    <main>
        <div class="container">
            <h1>Înmulțiri</h1>
            <div id="exercise" class="exercise"></div>
            <input type="number" id="answer" placeholder="Introdu răspunsul aici" />
            <button onclick="checkAnswer()">Verifică</button>
            <div id="feedback" class="feedback"></div>
        </div>
    </main>

    <!-- FOOTER standardizat -->
    

     <!-- dacă există script pentru meniul mobil -->
    <script>
        let currentExercise = 0;
        let num1, num2, correctAnswer;

        function generateExercise() {
            num1 = Math.floor(Math.random() * 10) + 1;
            num2 = Math.floor(Math.random() * 10) + 1;
            correctAnswer = num1 * num2;
            document.getElementById('exercise').textContent = `${num1} × ${num2} = ?`;
            document.getElementById('answer').value = '';
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').classList.remove('correct', 'error');
        }

        function checkAnswer() {
            const userAnswer = parseInt(document.getElementById('answer').value, 10);
            if (userAnswer === correctAnswer) {
                document.getElementById('feedback').textContent = 'Corect! Continuă așa!';
                document.getElementById('feedback').classList.add('correct');
                document.getElementById('feedback').classList.remove('error');
                currentExercise++;
                if (currentExercise < 10) {
                    setTimeout(generateExercise, 1000);
                } else {
                    document.getElementById('feedback').textContent = 'Felicitări! Ai terminat cele 10 exerciții! 🎉';
                    document.getElementById('exercise').textContent = '';
                    document.getElementById('answer').style.display = 'none';
                    document.querySelector('button').style.display = 'none';
                }
            } else {
                document.getElementById('feedback').textContent = 'Răspuns greșit. Încearcă din nou!';
                document.getElementById('feedback').classList.add('error');
                document.getElementById('feedback').classList.remove('correct');
            }
        }

        // Inițializare exercițiu
        generateExercise();
    </script>
