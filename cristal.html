<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="joc-inapoi" content="clasa3.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="LOGO.png">
<link rel="stylesheet" href="joc.css">
<title>Cristalele numerelor – Jocuri Logice</title>
<style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { background: linear-gradient(#2A1450, #4A2370); min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 70px 12px 24px; color: #231B33; }
    .jg-hud { position: fixed; }
    #card { width: min(100%, 460px); background: #fff; border-radius: 32px; padding: 20px 16px 18px; box-shadow: 0 20px 44px -18px rgba(0,0,0,.65); text-align: center; }
    .label { margin: 0; font: 800 .85rem var(--j-font-text); color: #5B5270; text-transform: uppercase; letter-spacing: .07em; }
    #target { width: 104px; height: 104px; margin: 8px auto 12px; border-radius: 50%; display: grid; place-items: center; background: #4A2370; color: #FFB81C; font: 700 2.8rem var(--j-font); box-shadow: 0 0 0 7px #EFE9F7; }
    #panel { min-height: 92px; padding: 10px 12px; border-radius: 20px; background: #F8F7FB; border: 2px solid #E6E2EE; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    #formula { font: 700 1.4rem var(--j-font); color: #4A2370; overflow-wrap: anywhere; min-height: 1.7rem; }
    #formula.hint { color: #9A8FB0; font-size: 1.05rem; font-family: var(--j-font-text); font-weight: 700; }
    #live { font: 700 2rem var(--j-font); color: #E8A100; font-variant-numeric: tabular-nums; }
    #live.ok { color: #14937A; }
    .row { display: grid; gap: 10px; margin-top: 12px; }
    #nums { grid-template-columns: repeat(4, 1fr); }
    .ops { grid-template-columns: repeat(4, 1fr); }
    .acts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    button.key { min-height: 62px; border: 0; border-radius: 18px; cursor: pointer; font: 700 1.7rem var(--j-font); -webkit-tap-highlight-color: transparent; box-shadow: 0 5px 0 rgba(35,27,51,.25); }
    button.key:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(35,27,51,.25); }
    .num { background: #1FBF9A; color: #231B33; } .num:disabled { background: #D4EFE8; color: #8CB5AB; box-shadow: none; cursor: default; }
    .op { background: #E23B6B; color: #fff; } .par { background: #8E5BD6; color: #fff; }
    .act { min-height: 50px; font-size: .95rem; padding: 0 4px; white-space: nowrap; background: #EFE9F7; color: #4A2370; box-shadow: 0 4px 0 #D9CCEB; border-radius: 16px; }
    #toast { position: fixed; z-index: 12; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none; font: 700 clamp(1.8rem, 8vw, 2.8rem) var(--j-font); color: #FFB81C; background: #4A2370; padding: 12px 28px; border-radius: 26px; box-shadow: 0 14px 30px -10px rgba(0,0,0,.6); transition: all .22s; text-align: center; white-space: nowrap; }
    #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body class="jg">
<div class="jg-hud"><span class="jg-pill">⭐ <b id="score">0</b></span><span class="jg-pill">🏆 <b id="best">0</b></span></div>
<div id="toast">Bravo!</div>
<main id="card">
    <p class="label">Număr necesar</p>
    <div id="target">--</div>
    <div id="panel"><div id="formula" class="hint">Alege cifre și operații</div><div id="live">0</div></div>
    <div class="row" id="nums"></div>
    <div class="row ops" id="ops"></div>
    <div class="row acts">
        <button class="key act" id="back" type="button">⌫ Șterge</button>
        <button class="key act" id="reset" type="button">↺ Reia</button>
        <button class="key act" id="skip" type="button">⏭ Sari</button>
    </div>
</main>

<script>
const PAREN = false, KEY = 'cristal_best';
const $ = (id) => document.getElementById(id);
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
let score = 0, best = 0, target = 0, numbers = [], formula = [], used = [], solved = false;
try { best = parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
$('best').textContent = best;

/* evaluator sigur (fără eval): + − × ÷ și paranteze */
function evaluate(tokens) {
    let i = 0;
    const peek = () => tokens[i];
    function expr() { let v = term(); while (peek() === '+' || peek() === '-') { const o = tokens[i++]; const r = term(); v = o === '+' ? v + r : v - r; } return v; }
    function term() { let v = factor(); while (peek() === '*' || peek() === '/') { const o = tokens[i++]; const r = factor(); v = o === '*' ? v * r : v / r; } return v; }
    function factor() {
        const t = tokens[i++];
        if (typeof t === 'number') return t;
        if (t === '(') { const v = expr(); if (tokens[i++] !== ')') throw 0; return v; }
        throw 0;
    }
    const v = expr(); if (i !== tokens.length) throw 0; return v;
}
const OPS = ['+', '-', '*'];
function makeProblem() {
    for (let t = 0; t < 200; t++) {
        const n1 = rnd(2, 9), n2 = rnd(2, 9), n3 = rnd(2, 6), n4 = rnd(1, 9);
        const o1 = OPS[rnd(0, 2)], o2 = OPS[rnd(0, 2)];
        const toks = PAREN ? ['(', n1, o1, n2, ')', o2, n3] : [n1, o1, n2, o2, n3];
        let v; try { v = evaluate(toks); } catch (e) { continue; }
        if (Number.isInteger(v) && v >= 5 && v <= 99 && ![n1, n2, n3, n4].includes(v)) return { target: v, numbers: [n1, n2, n3, n4].sort(() => Math.random() - .5) };
    }
    return { target: 24, numbers: [2, 3, 4, 6].sort(() => Math.random() - .5) };
}
function newProblem() {
    const p = makeProblem(); target = p.target; numbers = p.numbers; formula = []; used = []; solved = false;
    $('target').textContent = target; renderNums(); update();
}

function renderNums() {
    const box = $('nums'); box.innerHTML = '';
    numbers.forEach((n, i) => {
        const b = document.createElement('button'); b.className = 'key num'; b.type = 'button'; b.textContent = n; b.disabled = used.includes(i);
        b.addEventListener('click', () => addNumber(n, i)); box.appendChild(b);
    });
}
const isNum = (x) => typeof x === 'number';
function addNumber(n, i) {
    if (solved) return; const last = formula[formula.length - 1];
    if (isNum(last) || last === ')') return;
    formula.push(n); used.push(i); renderNums(); update(); check();
}
function addOp(p) {
    if (solved) return; const last = formula[formula.length - 1];
    if (p === '(') { if (isNum(last) || last === ')') return; }
    else if (p === ')') { const o = formula.filter(x => x === '(').length, c = formula.filter(x => x === ')').length; if ((!isNum(last) && last !== ')') || o <= c) return; }
    else { if (formula.length === 0 || (!isNum(last) && last !== ')')) return; }
    formula.push(p); update();
}
function undo() {
    if (solved || !formula.length) return;
    const x = formula.pop(); if (isNum(x)) { // eliberează ultimul număr folosit
        used.pop(); renderNums();
    }
    update();
}
function resetAll() { if (solved) return; formula = []; used = []; renderNums(); update(); }

function current() {
    if (!formula.length) return null;
    const t = [...formula];
    const open = t.filter(x => x === '(').length, close = t.filter(x => x === ')').length;
    while (t.length && !isNum(t[t.length - 1]) && t[t.length - 1] !== ')') t.pop();
    for (let i = 0; i < open - close; i++) t.push(')');
    if (!t.length) return null;
    try { return evaluate(t); } catch (e) { return null; }
}
function update() {
    const f = $('formula');
    if (!formula.length) { f.textContent = 'Alege cifre și operații'; f.classList.add('hint'); } else { f.classList.remove('hint'); f.textContent = formula.map(x => x === '*' ? '×' : x === '/' ? '÷' : x === '-' ? '−' : x).join(' '); }
    const v = current();
    $('live').textContent = v === null ? '0' : (Number.isInteger(v) ? v : v.toFixed(1));
    $('live').classList.toggle('ok', v === target);
}
function check() {
    const last = formula[formula.length - 1];
    if (!(isNum(last) || last === ')')) return;
    const o = formula.filter(x => x === '(').length, c = formula.filter(x => x === ')').length; if (o !== c) return;
    const v = current();
    if (v !== null && Math.abs(v - target) < 1e-9 && formula.length >= 3) {
        solved = true; score += 20; $('score').textContent = score;
        if (score > best) { best = score; $('best').textContent = best; try { localStorage.setItem(KEY, best); } catch (e) {} }
        const t = $('toast'); t.innerHTML = '💎 Cristal activat!<br><small style="font-size:.5em">+20 puncte</small>'; t.classList.add('show');
        setTimeout(() => { t.classList.remove('show'); newProblem(); }, 1500);
    }
}

[['+', '+'], ['-', '−'], ['*', '×'], ['/', '÷']].forEach(([v, s]) => {
    const b = document.createElement('button'); b.className = 'key op'; b.type = 'button'; b.textContent = s; b.addEventListener('click', () => addOp(v)); $('ops').appendChild(b);
});
if (PAREN) ['(', ')'].forEach(p => { const b = document.createElement('button'); b.className = 'key par'; b.type = 'button'; b.textContent = p; b.addEventListener('click', () => addOp(p)); $('ops').appendChild(b); });
$('back').addEventListener('click', undo); $('reset').addEventListener('click', resetAll); $('skip').addEventListener('click', () => { if (!solved) newProblem(); });
newProblem();
</script>
<script src="joc.js"></script>
</body>
</html>
