<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="joc-inapoi" content="clasa4.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="LOGO.png">
<link rel="stylesheet" href="joc.css">
<title>Misiunea numerelor – Jocuri Logice</title>
<style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { background: linear-gradient(#2A1450, #4A2370); color: #231B33; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 70px 14px 24px; }
    .jg-hud { position: fixed; }
    #card { width: min(100%, 520px); background: #fff; border-radius: 32px; padding: 22px 18px 20px; box-shadow: 0 20px 44px -18px rgba(0,0,0,.65); text-align: center; position: relative; }
    #card.shake { animation: shake .35s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-9px); } 75% { transform: translateX(9px); } }
    .stage { margin: 0; font: 800 .95rem var(--j-font-text); color: #E23B6B; text-transform: uppercase; letter-spacing: .06em; min-height: 1.3em; }
    .bar { height: 12px; border-radius: 99px; background: #EFE9F7; margin: 10px 0 4px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: #1FBF9A; transition: width .3s; }
    #timerBox { display: none; margin: 6px auto 0; width: max-content; padding: 4px 16px; border-radius: 99px; background: #FFE9A8; font: 700 1.1rem var(--j-font); color: #231B33; }
    #timerBox.low { background: #FBC9D7; color: #B82A53; }
    #question { margin: 12px 0 18px; font: 700 clamp(2.4rem, 11vw, 3.8rem)/1.1 var(--j-font); color: #4A2370; overflow-wrap: anywhere; }
    #options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .opt { min-height: 72px; border: 0; border-radius: 22px; font: 700 clamp(1.5rem, 7vw, 2.2rem) var(--j-font); cursor: pointer; color: #fff; box-shadow: 0 6px 0 rgba(35,27,51,.28); -webkit-tap-highlight-color: transparent; }
    .opt:nth-child(1) { background: #6A3BA0; } .opt:nth-child(2) { background: #E8541F; } .opt:nth-child(3) { background: #8E5BD6; } .opt:nth-child(4) { background: #D9356A; }
    .opt:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(35,27,51,.28); }
    .opt.ok { background: #1FBF9A !important; color: #231B33; } .opt.bad { background: #9A8FB0 !important; }
    .opt:disabled { cursor: default; }
    #toast { position: fixed; z-index: 12; left: 50%; top: 20%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none; font: 700 clamp(2rem, 9vw, 3.2rem) var(--j-font); color: #FFB81C; text-shadow: 0 4px 0 #4A2370; transition: all .22s; }
    #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body class="jg">
<div class="jg-hud"><span class="jg-pill">⭐ <b id="score">0</b></span><span class="jg-pill" id="livesPill">❤️ <b id="lives">3</b></span><span class="jg-pill">🏆 <b id="best">0</b></span></div>
<div id="toast">Bravo!</div>
<main id="card">
    <p class="stage" id="stage"></p>
    <div class="bar" id="barWrap"><i id="bar"></i></div>
    <div id="timerBox">⏱ <span id="timer">30</span> s</div>
    <h1 id="question">…</h1>
    <div id="options"></div>
</main>

<div class="jg-overlay" id="overlay">
    <div class="jg-emoji" id="ovEmoji">🧮</div>
    <h1 class="jg-title" id="ovTitle">Misiunea numerelor</h1>
    <p class="jg-text" id="ovText">Rezolvă calculele și treci prin toate nivelurile. Atenție la ordinea operațiilor!</p>
    <p class="jg-best" id="ovBest"></p>
    <button class="jg-btn" id="ovBtn" type="button">Start</button>
</div>

<script>
const CFG = { key: "misiune_best", mode: "stages", stages: [{ name: "Calcule rapide", tasks: [{ q: "55 + 45", a: 100, opts: [90, 100, 110, 105] },{ q: "150 − 60", a: 90, opts: [80, 90, 100, 70] },{ q: "7 × 8", a: 56, opts: [54, 56, 64, 48] },{ q: "81 ÷ 9", a: 9, opts: [7, 8, 9, 10] },{ q: "100 − 35", a: 65, opts: [65, 55, 75, 45] },{ q: "5 + 2 × 3", a: 11, opts: [21, 11, 10, 15] },{ q: "(10 − 2) × 5", a: 40, opts: [8, 40, 48, 50] },{ q: "20 ÷ 4 + 6", a: 11, opts: [2, 11, 10, 5] },{ q: "30 − 10 ÷ 2", a: 25, opts: [10, 25, 20, 15] },{ q: "4 × (3 + 7)", a: 40, opts: [19, 40, 25, 30] },{ q: "15 + 15 ÷ 3 − 2", a: 18, opts: [8, 18, 10, 28] }] }, { name: "Nivelul 2", tasks: [{ q: "(200 + 300) × 2", a: 1000, opts: [1000, 800, 700, 500] },{ q: "1200 − 400 ÷ 2", a: 1000, opts: [1000, 400, 800, 600] },{ q: "25 × 4 + 150", a: 250, opts: [250, 200, 300, 150] }] }, { name: "Provocarea finală", tasks: [{ q: "(50 × 4) + (25 × 2)", a: 250, opts: [250, 225, 300, 275] },{ q: "1000 ÷ 5 − 50", a: 150, opts: [150, 250, 100, 200] }], timer: 30, penalty: 5 }] };
const $ = (id) => document.getElementById(id);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
let score = 0, lives = 3, level = 1, idx = 0, stageIdx = 0, locked = false, timer = 0, timerId = null, best = 0, current = null, active = false;
try { best = parseInt(localStorage.getItem(CFG.key) || '0', 10) || 0; } catch (e) {}
$('best').textContent = best;
if (CFG.mode !== 'endless') { $('livesPill').hidden = true; } else { $('barWrap').hidden = true; }

function genEndless() { return CFG.gen(level); }
function makeOpts(answer, wrongs) { return [answer, ...wrongs].sort(() => Math.random() - .5); }

function loadTask() {
    locked = false;
    if (CFG.mode === 'endless') {
        $('stage').textContent = CFG.levels ? 'Nivelul ' + level : '';
        current = genEndless();
    } else {
        const st = CFG.stages[stageIdx];
        if (idx >= st.tasks.length) { return stageDone(); }
        $('stage').textContent = st.name + ' · ' + (idx + 1) + '/' + st.tasks.length;
        $('bar').style.width = (idx / st.tasks.length * 100) + '%';
        const t = st.tasks[idx];
        current = { q: t.q, a: t.a, opts: [...t.opts].sort(() => Math.random() - .5) };
    }
    $('question').textContent = current.q;
    const box = $('options'); box.innerHTML = '';
    current.opts.forEach(v => {
        const b = document.createElement('button'); b.className = 'opt'; b.type = 'button'; b.textContent = v;
        b.addEventListener('click', () => answer(b, v)); box.appendChild(b);
    });
}

function toast(t, c) { const e = $('toast'); e.textContent = t; e.style.color = c || '#FFB81C'; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 700); }
function saveBest() { if (score > best) { best = score; $('best').textContent = best; try { localStorage.setItem(CFG.key, best); } catch (e) {} } }

function answer(btn, v) {
    if (locked || !active) return; locked = true;
    const ok = v === current.a;
    document.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (Number(b.textContent) === current.a) b.classList.add('ok'); });
    if (ok) {
        score += 10; $('score').textContent = score; saveBest(); toast(pick(['Bravo!', 'Super!', 'Excelent!', 'Corect!']));
        if (CFG.mode === 'endless') {
            if (CFG.levels && score % 50 === 0) { level++; toast('Nivel nou! 🚀'); }
            setTimeout(loadTask, 650);
        } else { idx++; setTimeout(loadTask, 650); }
    } else {
        btn.classList.add('bad'); $('card').classList.add('shake'); setTimeout(() => $('card').classList.remove('shake'), 400);
        if (CFG.mode === 'endless') {
            lives--; $('lives').textContent = Math.max(lives, 0); toast('Aproape!', '#fff');
            setTimeout(() => { if (lives <= 0) gameOver(); else loadTask(); }, 1100);
        } else {
            toast('Mai încearcă!', '#fff');
            const st = CFG.stages[stageIdx]; if (st.timer) { timer = Math.max(0, timer - st.penalty); renderTimer(); }
            setTimeout(() => { locked = false; document.querySelectorAll('.opt').forEach(b => { b.disabled = false; b.classList.remove('ok'); }); btn.classList.add('bad'); btn.disabled = true; }, 700);
        }
    }
}

/* ---------- etape (mod cu niveluri fixe) ---------- */
function renderTimer() { $('timer').textContent = timer; $('timerBox').classList.toggle('low', timer <= 10); }
function startStageTimer() {
    clearInterval(timerId); const st = CFG.stages[stageIdx];
    if (!st.timer) { $('timerBox').style.display = 'none'; return; }
    timer = st.timer; $('timerBox').style.display = 'block'; renderTimer();
    timerId = setInterval(() => { timer--; renderTimer(); if (timer <= 0) { clearInterval(timerId); active = false; showOverlay('⏰', 'Timpul a trecut!', 'Mai încearcă provocarea finală. Ai ' + st.timer + ' secunde.', 'Încearcă din nou', () => { idx = 0; beginStage(); }); } }, 1000);
}
function beginStage() { active = true; $('overlay').hidden = true; if (CFG.mode !== 'endless') startStageTimer(); loadTask(); }
function stageDone() {
    clearInterval(timerId); active = false; $('bar').style.width = '100%';
    const last = stageIdx >= CFG.stages.length - 1;
    if (last) { showOverlay('🏆', 'Misiune îndeplinită!', 'Ai rezolvat toate problemele. Bravo, campionule!', 'Joacă din nou', restart); return; }
    const next = CFG.stages[stageIdx + 1];
    showOverlay('🌟', 'Nivel terminat!', 'Urmează: ' + next.name + '.', 'Continuă', () => { stageIdx++; idx = 0; beginStage(); });
}

function showOverlay(emoji, title, text, btn, fn) {
    $('ovEmoji').textContent = emoji; $('ovTitle').textContent = title; $('ovText').textContent = text;
    $('ovBest').textContent = best ? '🏆 Cel mai bun scor: ' + best : '';
    $('ovBtn').textContent = btn; $('ovBtn').onclick = fn; $('overlay').hidden = false;
}
function gameOver() { active = false; saveBest(); showOverlay(score >= 100 ? '🌟' : '🙂', 'Ai strâns ' + score + ' puncte!', 'Încearcă din nou, devii tot mai bun!', 'Încă o dată', restart); }
function restart() { score = 0; lives = 3; level = 1; idx = 0; stageIdx = 0; $('score').textContent = '0'; $('lives').textContent = '3'; beginStage(); }

$('ovBtn').onclick = restart;
$('ovBest').textContent = best ? '🏆 Cel mai bun scor: ' + best : '';
</script>
<script src="joc.js"></script>
</body>
</html>
